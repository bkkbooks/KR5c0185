front:
  text: 三洞法服科戒文力五
  hash: sha256:1ad5b9819dd7a304f162af5e070a4807f921477d95fa786f54c49a297df0bc2e
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5c0185_HFL_000-001a, image: hfl/0563/0563-004.png}
body:
  text: 三洞弟子京太清觀道士張萬福編録天師請問法服品太上授道陵三天法師正一真人巳乃命雲宫玉女出九光寶耀蓮冠五色丹羅錦帔雲縠絳文仙褐翔鳳飛錦羽裙七色寶雲錦襡瑶華蘂珠文履碧瑶之笏七寶之函流精華佩琅英繡璫龍錦坐褥瓊鳳香爐交龍玉几斑麟翠拂明光如意十有五種以錫天師天師冠帶法服五體投地禮拜太上因啓問曰未審三清上境及諸凡界聖真仙服為有差降為復等乎愚所未覩願垂分别以示將來太上曰衣服者身之章也隨其稟受品次不同各有科儀凡有九等汝可諦聽當為子説一者大羅法王元始天尊冠須臾萬變九色寶冠衣千種離合自然雲帔著十轉九變青錦華裙七明四照參差寶襡五種變化十寶珠履左右侍真皆悉同然二者玉清法王無形天尊冠須臾千變七色寶冠衣百變離合飛雲之帔九轉七變翠錦飛裙七明四照流霞錦襡七寶變化丹雲繡履左右侍真亦復同矣三者上清法王無名天尊冠須臾百變五色寶冠衣十種離合流霄之帔八轉五變黃錦霞裙七明四照飛光錦襡五采變化自然瓊履左右侍真亦復同也四者太清法王太一天尊冠須臾十變蓮精寶冠衣九種離合五雲華帔七轉四變紫錦羽裙七明四照玄光丹襡自然變見師子文履左右侍真亦復同焉五者四梵天中化主無相天尊冠流精耀日花冠衣玄鳳瑶華之帔翠錦丹羽飛裙五明景雲寶襡飛龍轉變之履左右侍真亦復同耳又紫帔青裙蒼帔丹裙緑帔絳裙丹帔黃裙黃帔素裙絳龍錦裙悉侍真之服自四梵以上皆飛雲流霄自然妙氣結成衣服九色寶光而生萬物長短大小隨境應形或明光八照圎象洞煥景耀逺近變化自然或九色合成萬種分輝或龍鳳結彩山水流形千變萬化不可得名乃至都治城郭宫闕殿堂樓閣臺榭草木禽獸車輿器物幡幢帳座種種法具皆是自然應緣而見本無質礙隱顯靡常六者無色天中仙真聖服及諸天帝冠飛雲寶冠衣九色無縫之帔翠龍華裙五色錦襡祥鸞瓊履皆自然而生應念來至乃至宫殿臺閣車輿器物玩弄服飾苑囿花果音樂法具一切所須悉皆如是七者色界天中仙真聖品及諸天帝冠蓮華晨冠衣飛雲錦帔絳霄飛裙流景錦襡瓊鳳文履雖有形礙而非世間所造同於自然乃至居住車騎法具隨心所欲應念而生變化自在不比於常八者欲界天中仙真聖品冠珠玉之冠衣五雲之帔飛華翠裙流光羽襡九光文履皆以當界所植或於諸天中得或下方神仙奉獻結造所成不同下界有所勞苦乃至居處房殿車輿法物亦復如是九者山上靈宫及五嶽名山洞宫諸神仙靈官真官守土職司冠七寶之冠衣九光霞帔飛青華裙雲錦繡襡鸞鳳文履悉以諸天錦綺及下方珍物或變練而成非如世間之所製造或乘鸞駕鶴控馭龍虎白鹿獅子靈禽神獸飛雲丹霄緑輿瓊輪持幢鼓節執符把籙出入人間應心所欲隨感而至或上界真仙下世教化因時所服不異人問或下界真仙上朝諸天其所服馭參同上境而變化自然實非汝凡情之所測度天師又問曰夫衣服者本為有形今上聖既無形質衣服何所設耶太上曰上聖無形實不資衣服但應迹人間而有衣服若歸真反本湛寂自然形影尚空何論衣服今雖示迹略有九階要而言之大歸二種一者無衣之衣謂四梵以上妙體自然變化無常本無形質或隱或顯應是化身接引下凡暫假衣服隨機設教逐境分儀神用自然變化不測此不衣而衣示同凡也二者有衣之衣謂三界以下乃至棄賢形質尚粗未能合道遊行出處要籍威儀衣服階修致有差别又有七種須案奉行劫運雖傾此法無變一者初入道門平冠黃帔二者正一芙蓉玄冠黃裙絳褐三者道德黃褐玄巾四者洞神玄冠青褐五者洞玄黃褐玄冠皆黃裙對之冠象蓮花或四面兩葉褐用三丈六尺身長三尺六寸女子二丈四尺身長二尺四寸袖領帶䋸就令取足作三十二條帔用二丈四尺二十四條男女同法六者洞真褐帔用紫紗三十六尺長短如洞玄法以青為裏袖領䋸帶皆就取足表二十五條裏一十四條合三十九條飛青華裙蓮花寶冠或四面三葉謂之元始冠女子褐用紫紗二丈四尺長二尺四寸身二十三條兩袖十六條合三十九條作青紗之裙戴飛雲鳳氣之冠七者三洞講法師如上清衣服上加九色若五色雲霞山水袖帔元始寶冠皆環佩執板師子文履謂之法服悉有天男天女玉童玉女侍奉護持不得叨謬諸天敬仰群魔束形子其勉之天師曰未審下世道士紹聖教者法服云何太上曰若當來男女修行我法捨俗出家當須持奉三洞符籙經戒依此制服隨其經戒髙下勿得叨謬混雜仙真常須清淨燒香左右無使穢汚濁辱仙靈冠者觀也內觀於身結大福緣天地百神威奉於巳當自寶貴以道護持制斷六情抑止貪欲虛心靜慮滌蕩塵勞念念至誠尅登道果外觀於物悉非我有妄生貪著惑亂我心當須觀妙常使無欲以其觀察德美於身上法三光照明內外如彼蓮花處世無染又花為果始用冠一形舉之于首圎通無礙帔者披也內則披露肝心無諸滓穢外則披揚道德開悟衆生使內外開通彼我皆濟隨時教化救度衆生一切歸依此最為上褐者遏也割也內遏情欲使不外彰割斷諸根永絶萌蘖外遏貪取使不內入割斷諸物永無煩惱內外遏絶物我兼忘行道誦經不可闕也裙者群也內斷群迷外祛群纍攝化萬物令入一乘永出樊籠普令解脫冠以法天有三光之象裙以法地有五嶽之形帔法隂陽有生成之德總謂法服名曰出家內服巳身六根三業調練形神外服衆生三塗五道救拔人天遍及聖凡知有所法景行可尊又法天尊聖真仙服住持經戒教化人間必使師資相習真道流通易此俗衣著彼仙服道能服物德可法人以是因緣名法服也太上曰吾昔服日光帔讀洞真寶經服月光帔讀洞玄真經服星光帔讀洞神仙經服九色離羅帔講三洞大乘經服五色雲帔教化人間服自然之帔遊行諸天服萬變雲帔上朝大羅服光明寶帔下救三塗常使玉女玉童二百四十人典侍法服清淨燒香若道士常須備其法服整飾形容沭浴冠帶朝奉天真教化一切勿得暫捨法服不住威儀無使非人犯法服也天師稽首禮拜奉行天師受法服巳即説科戒四十六條傳教將來第一不冠法服不得登壇入靜禮願啓請悔過求恩第二不冠法服不得逼近經戒講説念誦看讀敷揚第三不冠法服不得持奉齋戒受人禮拜飲食供養第四不冠法服不得禮拜師尊長德及受弟子禮拜第五不冠法服不得出入所居人間遊行見諸凡人第六不冠法服不得祝禁符劾章奏表啓第七不冠法服不得覲見國主父母及諸世民第八寢息休暇當脫法服第九沐浴浣濯當脫法服第十大小便曲當脫法服第十一泥雨濁穢當脫法服第十二供養給使師尊父母勿脫法服第十三檢校修造一切功德勿脫法服第十四檢校營造齋供花果勿脫法服第十五檢校種植勿脫法服第十六非枷獄病苦勿脫法服第十七手足不淨勿犯法服第十八器物不淨勿犯法服第十九牀席不淨勿犯法服第二十車輿不淨勿犯法服第二十一祼露身形勿犯法服第二十二鳥獸蟲魚勿犯法服第二十三口氣臭穢勿犯法服第二十四非同學弟子勿犯法服第二十五始欲出家先備法服第二十六欲受經戒須備法服第二十七詣師請經道戒籙須上法服第二十八詣師請福解免厄苦須上法服第二十九法服不得用五綵作第三十法服不得以非義物作第三十一法服不得用錦繡綺作第三十二法服不得不依法作第三十三法服不得假借他人第三十四法服不得隨宜拋擲第三十五法服不得安卧牀上第三十六法服不得坐卧其上第三十七法服不得以腳踏洗及捶拍第三十八法服破壞當須火淨第三十九法服不得過三具餘便施人第四十法服破壞及餘物不得充非用并凡人著第四十一法服作成燒香啓告禮拜三寶先獻三寶及諸仙真聖然後取著第四十二法服近經像者不得著人間及不淨處第四十三法服須勤洗濯燒香清淨箱簏藏舉勿使汚穢常置淨室第四十四不得著法服遊五種家第四十五不得擅脫法服潛遊人間第四十六坐起卧息常依科戒天師曰道士護持法服當如兩眼又如手足何以故人若無眼不能覩見天地萬物好惡是非若無手足不能運轉身形逺近行坐名不具足是盲衆生道士不持法服失十種恭敬得十種輕賤一者諸天生不恭敬二者諸魔生不恭敬三者鬼神生不恭敬四者帝王生不恭敬五者父母生不恭敬六者兄弟生不恭敬七者姊妹生不恭敬八者眷屬生不恭敬九者貴人生不恭敬十者賤人生不恭敬一者得諸天輕賤二者得諸魔輕賤三者得鬼神輕賤四者得帝王輕賤五者得父母輕賤六者得兄弟輕賤七者得姊妹輕賤八者得眷屬輕賤九者得貴人輕賤十者得賤人輕賤見世所在之處失其勝福過去受豬狗之身若護持者見世所在之處得其果報過去生諸天中者凡諸男女寧脫巳之服不得脫出家法服寧犯毒蛇不得犯出家法服寧坐大火坑不得與出家同坐若道士自外法服邀世榮華是其福盡雖暫光耀不久惡至過去入寒氷地獄後受祼露之身何以故此人自取沉淪也天師曰應服不服非服而服皆四司考魂奪算一千二百天師曰道士衣服卧具坐褥皆不得用青緑紺絳紅碧玄素錦綺繡畫珠玉間錯違者四司考魂奪算八百三洞法服科戒文
